<!DOCTYPE html>
<html>
<head>
    <title>Drone System (Push Mode)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body { font-family: Arial; }

        #video {
            width: 640px;
            border: 2px solid #333;
        }

        button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Live Video</h2>
<img id="video" src="/video" />

<!-- ✅ RESET BUTTON（正確位置） -->
<button onclick="resetDemo()">RESET DEMO</button>

<h2>Data</h2>
<p>Count: <span id="count">0</span></p>
<p>Total: <span id="total">0</span></p>

<h2>Map</h2>
<div id="map" style="height:400px;"></div>

<h2>AI Analysis</h2>
<pre id="analysis"></pre>

<script>
var map = L.map('map').setView([24.1858,120.6532], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

var heat = L.heatLayer([], {radius: 25}).addTo(map);

// ------------------
// SAFE fetch
// ------------------
async function safeFetch(url, parser='json') {
    try {
        let res = await fetch(url);
        if (!res.ok) return null;
        return parser === 'json' ? res.json() : res.text();
    } catch (e) {
        return null;
    }
}

// ------------------
// RESET FUNCTION
// ------------------
function resetDemo(){
    fetch('/reset', {method: 'POST'})
        .then(r => r.json())
        .then(d => {
            console.log("RESET OK", d);

            // optional: clear UI instantly
            heat.setLatLngs([]);
            document.getElementById("count").innerText = 0;
            document.getElementById("total").innerText = 0;
            document.getElementById("analysis").innerText = "";
        });
}

// ------------------
// UPDATE LOOP
// ------------------
setInterval(async () => {

    let d = await safeFetch('/data');
    if (d) {
        document.getElementById("count").innerText = d.count ?? 0;
        document.getElementById("total").innerText = d.total ?? 0;
    }

    let h = await safeFetch('/heatmap');
    if (h) {
        heat.setLatLngs(h.map(p => [p.lat, p.lng, p.weight]));
    }

    let a = await safeFetch('/analysis', 'text');
    if (a) {
        document.getElementById("analysis").innerText = a;
    }

}, 1000);

// ------------------
// video retry
// ------------------
const video = document.getElementById("video");

video.onerror = () => {
    console.log("Video stream lost, retrying...");
    setTimeout(() => {
        video.src = "/video?t=" + new Date().getTime();
    }, 2000);
};

</script>

</body>
</html>
